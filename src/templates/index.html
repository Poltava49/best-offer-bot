<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace Parser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f4f0;
            color: #1a1a1a;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
        }
        .tag {
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #aaa;
        }
        h1 {
            font-size: clamp(3rem, 8vw, 6.5rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            margin: 0;
        }
        h1 span { color: #7c3aed; }
        .sub {
            color: #888;
            font-size: 1rem;
            max-width: 340px;
            line-height: 1.6;
        }
        .btn-go {
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            padding: 0.75rem 2rem;
            text-decoration: none;
            display: inline-block;
            transition: background 0.15s;
        }
        .btn-go:hover { background: #6d28d9; color: #fff; }
        .markets {
            display: flex;
            gap: 1.5rem;
            color: #bbb;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
        }
        .divider {
            width: 40px;
            height: 2px;
            background: #7c3aed;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="tag">v1.0 · parser bot</div>
    <div>
        <div class="divider"></div>
        <h1>Best<br><span>Offer</span></h1>
        <p class="sub mt-4">Парсим маркетплейсы и находим лучшую цену по вашему запросу.</p>
        <a href="/parser" class="btn-go mt-4">Найти товар →</a>
    </div>
    <div class="markets">
        <span>Wildberries</span>
        <span>Ozon</span>
        <span>Яндекс Маркет</span>
    </div>
</div>
</body>
</html>
