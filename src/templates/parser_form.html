<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Поиск товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f4f0;
            color: #1a1a1a;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2.5rem;
            max-width: 540px;
        }
        .back {
            font-size: 0.82rem;
            color: #aaa;
            text-decoration: none;
            letter-spacing: 0.06em;
            margin-bottom: 3rem;
            display: inline-block;
            transition: color 0.15s;
        }
        .back:hover { color: #7c3aed; }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
        }
        label {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #999;
            display: block;
            margin-bottom: 0.5rem;
        }
        input[type="text"], select {
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            color: #1a1a1a;
            border-radius: 6px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.15s;
            appearance: none;
            -webkit-appearance: none;
        }
        input[type="text"]:focus, select:focus { border-color: #7c3aed; }
        input::placeholder { color: #bbb; }
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '↓';
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
        }
        .field { margin-bottom: 1.5rem; }
        button[type="submit"] {
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            padding: 0.85rem;
            width: 100%;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.15s;
        }
        button[type="submit"]:hover { background: #6d28d9; }
        button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
<div class="page">
    <a href="/" class="back">← Назад</a>
    <h2>Что ищем?</h2>
    <form action="/parser" method="post" id="searchForm">
        <div class="field">
            <label>Товар</label>
            <input type="text" name="product_name" placeholder="Например: iPhone 15 Pro" required autofocus>
        </div>
        <div class="field">
            <label>Маркетплейс</label>
            <div class="select-wrap">
                <select name="marketplaces" required>
                    <option value="wb">Wildberries</option>
                    <option value="ozon">Ozon</option>
                    <option value="yandex">Яндекс Маркет</option>
                </select>
            </div>
        </div>
        <button type="submit" id="submitBtn">Найти</button>
    </form>
</div>
<script>
    document.getElementById('searchForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Ищем...';
        btn.disabled = true;
    });
</script>
</body>
</html>
