services:
  telegram_bot:
    build: .
    container_name: telegram_bot
    restart: always
    env_file: .env
    ports:
      - "5051:8080"
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: 2gb

  postgres:
    image: postgres:14
    container_name: postgres_container_bot_offer
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: parser_bot_db
    volumes: #том в докере для маппинга
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container_bot_offer
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5080:5080"
    depends_on:
      - postgres
volumes:
  postgres_data:
