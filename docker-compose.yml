services:
    api:
      build: .
      container_name: fastapi_app
      ports:
        - "8000:8000"
      env_file:
        - .env
      depends_on:
        postgres:
          condition: service_started
      shm_size: 2g
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      restart: always

    postgres:
      image: postgres:14
      container_name: postgres_container_bot_offer
      restart: always
      env_file: .env
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: qwerty
        POSTGRES_DB: parser_bot_db
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

    pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin_container_bot_offer
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: password
      ports:
        - "5080:80"
      depends_on:
        - postgres
volumes:
  postgres_data:
