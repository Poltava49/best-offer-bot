services:
    api:
      build: .
      container_name: fastapi_app
      ports:
        - "8000:8000"
      env_file:
        - .env
      depends_on:
        postgres:
          condition: service_started
        selenium:
          condition: service_healthy
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
      volumes:
        - .:/app
      restart: always

    selenium:
      image: selenium/standalone-chromium:latest
      container_name: selenium-container
      restart: unless-stopped
      shm_size: 2g
      ports:
        - "4444:4444"  # Selenium WebDriver API
        - "7900:7900"  # VNC Viewer
      environment:
        - SE_NODE_MAX_SESSIONS=1
        - SE_NODE_OVERRIDE_MAX_SESSIONS=true
        - SE_NODE_SESSION_TIMEOUT=300
        - SE_NODE_GRID_URL=http://localhost:4444
        - SE_NODE_DETECT_DRIVERS=false
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:4444/"]
        interval: 5s
        timeout: 10s
        retries: 10
        start_period: 10s

    postgres:
      image: postgres:14
      container_name: postgres_container_bot_offer
      restart: always
      env_file: .env
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: qwerty
        POSTGRES_DB: parser_bot_db
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

    pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin_container_bot_offer
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: password
      ports:
        - "5080:80"
      depends_on:
        - postgres
volumes:
  postgres_data:
