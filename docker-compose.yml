services:
  bestoffer:
    build: .
    container_name: bestoffer
    restart: always
    env_file: .env
    ports:
      - "5051:8080"
    depends_on:
      postgres:
        condition: service_started
      selenium:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: 2gb

  selenium:
    image: selenium/standalone-chromium:latest 
    container_name: selenium-container
    restart: unless-stopped
    shm_size: 2g
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_GRID_URL=http://localhost:4444
      - SE_NODE_DETECT_DRIVERS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.6
    container_name: besoffer-cache
    restart: always
    ports:
      - "6379:6379"

  postgres:
    image: postgres:14
    container_name: postgres_container_bot_offer
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: parser_bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container_bot_offer
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5080:5080"
    depends_on:
      - postgres
volumes:
  postgres_data:
