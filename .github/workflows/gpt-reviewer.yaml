name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@v0.56.0
        with:
          review-command: run-summary
        env:
          # --- LLM provider ---
          LLM__PROVIDER: OPENROUTER
          LLM__META__MODEL: "openrouter/auto"
          LLM__META__TEMPERATURE: "0.1"
          LLM__META__MAX_TOKENS: "6000"
          LLM__HTTP_CLIENT__API_URL: https://openrouter.ai/api/v1
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}

          # --- VCS / GitHub ---
          VCS__PROVIDER: GITHUB
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: https://api.github.com
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- Review filters ---
          REVIEW__MODE: FULL_FILE_DIFF
          REVIEW__IGNORE_CHANGES: '["*.lock", "uv.lock", "poetry.lock", "requirements.lock", "dist/*", "build/*", "docs/*", "vendor/*"]'
          REVIEW__MAX_INLINE_COMMENTS: "5"
          REVIEW__MAX_CONTEXT_COMMENTS: "10"
          REVIEW__INLINE_COMMENT_FALLBACK: "true"

          # --- Logger ---
          LOGGER__LEVEL: INFO
          LOGGER__FORMAT: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {extra[logger_name]} | {message}"
