[project]
name = "best-offer-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
  "aiogram>=3.24.0",
  "async>=0.6.2",
  "playwright>=1.57.0",
  "psycopg>=3.3.2",
  "python-telegram-bot>=22.6",
]

[dependency-groups]
dev = [
  "bandit>=1.9.3",
  "mypy>=1.19.1",
  "pip-audit>=2.10.0",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.2",
  "sqlfluff>=4.0.0",
  "dotenv-linter>=0.7.0",
  "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
mypy_path = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D212", "COM812", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "INP001", "ARG001", "ARG002"]
